[project]
name = "langchain-starter-agent"
version = "0.1.0"
description = "An unfinished local-first AI agent for personal assistance and coding, with optional cloud models"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.1",
    "langchain[mcp]>=1.4.2",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.7",
    "rich>=15.0.0",
    "langchain-ollama>=1.1.0",
    "textual>=0.80.0",
    "langchain-core>=1.6.7",
    "langgraph>=1.2.14",
    "ollama>=0.6.3",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "keyring>=25.0.0",
    "watchfiles>=1.0.0",
]

[project.scripts]
agent = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# The project and uv's cache may be on different mounts. Copying avoids the
# hardlink warning while keeping the environment independent of the cache.
link-mode = "copy"

[tool.hatch.build.targets.wheel]
include = ["*.py", "ethics_manifesto.md"]
