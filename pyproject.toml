[project]
name = "langchain-starter-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "langchain[mcp]>=1.4.2",
    "langchain-google-genai>=4.4.0",
    "rich>=15.0.0",
    "uuid>=1.30",
    "langchain-mcp-adapters>=0.3.1",
    "deepagents>=0.7.21",
    "langchain-ollama>=1.1.0",
    "mpg123>=0.4",
    "langchain-tools>=0.1.34",
    "textual>=0.80.0",
]

[project.scripts]
agent = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["*.py"]
